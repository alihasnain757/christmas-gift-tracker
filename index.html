<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giftbook: Christmas gift planner</title>
<meta name="description" content="Plan Christmas gifts, budgets, shopping lists and Secret Santa. Works offline. Your data stays on your device.">
<style>
:root{
  --bg:#EDF3F0; --surface:#FFFFFF; --ink:#14231D; --muted:#566860; --line:#D1DDD7;
  --pine:#1E4A3B; --on-pine:#FFFFFF; --pine-soft:#DCE9E3;
  --berry:#A3162F; --berry-soft:#F6DCE1; --gold:#B8861B;
  --kraft:#C99A62; --kraft-ink:#2B1B0B; --focus:#0B6B52;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --bg:#0E1A16; --surface:#16261F; --ink:#E7F0EB; --muted:#9AAEA5; --line:#2A4237;
    --pine:#6DC2A4; --on-pine:#0E1A16; --pine-soft:#1F3A30;
    --berry:#F0728A; --berry-soft:#3A1C25; --gold:#E3B94F;
    --kraft:#B98650; --focus:#8EDCC0;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A16; --surface:#16261F; --ink:#E7F0EB; --muted:#9AAEA5; --line:#2A4237;
  --pine:#6DC2A4; --on-pine:#0E1A16; --pine-soft:#1F3A30;
  --berry:#F0728A; --berry-soft:#3A1C25; --gold:#E3B94F;
  --kraft:#B98650; --focus:#8EDCC0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
h1{font-size:30px}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.neg{color:var(--berry)}

/* chrome */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-family:var(--serif);font-size:24px;letter-spacing:.01em}
.brand span{font-size:13px;color:var(--muted)}
.nav{display:flex;gap:4px}
.nav a{padding:8px 14px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--pine-soft)}
.nav a[aria-current="page"]{background:var(--pine-soft);color:var(--pine);font-weight:700}
main{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
.banner{background:var(--berry-soft);color:var(--ink);border-bottom:1px solid var(--berry);padding:10px 20px;font-size:15px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--pine);background:var(--pine);color:var(--on-pine);font-weight:600;cursor:pointer;text-decoration:none;min-height:40px}
.btn:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;color:var(--pine);border-color:var(--line)}
.btn.quiet:hover{background:var(--pine-soft);filter:none}
.btn.danger{background:transparent;color:var(--berry);border-color:var(--berry)}
.btn.small{padding:5px 10px;min-height:32px;font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel > h2{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:20px;margin-top:20px;align-items:start}
.stack{display:grid;gap:20px}

/* hero with gift tag */
.hero{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;padding:8px 4px 8px}
.tag-wrap{position:relative;padding:36px 28px 8px 28px}
.twine{position:absolute;left:50%;top:0;width:90px;height:70px;margin-left:-14px;pointer-events:none;z-index:1}
.tag{position:relative;width:210px;padding:58px 20px 26px;background:var(--kraft);color:var(--kraft-ink);text-align:center;font-family:var(--serif);clip-path:polygon(24% 0,76% 0,100% 16%,100% 100%,0 100%,0 16%);transform:rotate(-2.5deg);transform-origin:50% 8%}
.tag::before{content:"";position:absolute;top:17px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--bg);box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.tag-big{display:block;font-size:80px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tag-big.word{font-size:46px;padding:14px 0 6px}
.tag-small{display:block;font-size:19px;margin-top:6px}
.tag-date{display:block;font-family:var(--sans);font-size:14px;margin-top:10px;opacity:.85}
@media (prefers-reduced-motion:no-preference){
  .tag.swing{animation:swing 1.3s ease-out 1}
}
@keyframes swing{0%{transform:rotate(9deg)}30%{transform:rotate(-6deg)}55%{transform:rotate(3deg)}80%{transform:rotate(-3.2deg)}100%{transform:rotate(-2.5deg)}}
.hero-main h1{margin-bottom:14px}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:0}
.money div{min-width:0}
.money dt{color:var(--muted);font-size:15px}
.money dd{margin:0;font-family:var(--serif);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.forecast{margin-top:14px;max-width:62ch}

/* progress */
.bar{position:relative;height:12px;border-radius:6px;background:var(--pine-soft);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;display:block}
.b-spent{left:0;background:var(--pine)}
.b-spent.hard{background:var(--berry)}
.b-plan{background:repeating-linear-gradient(135deg,var(--pine) 0 3px,transparent 3px 7px);opacity:.55}
.is-over .b-plan{background:repeating-linear-gradient(135deg,var(--berry) 0 3px,transparent 3px 7px);opacity:.7}
.bar b{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink)}
.legend{margin-top:14px;font-size:14px;color:var(--muted)}
.person-line{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:6px}
.person-line strong{font-weight:600}
.person-line span{font-variant-numeric:tabular-nums;font-size:15px}
.person-block{padding:12px 0;border-top:1px solid var(--line)}
.person-block:first-of-type{border-top:0;padding-top:0}
.person-note{font-size:14px;margin-top:6px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ring{margin:0;text-align:center}
.ring svg{width:100%;max-width:96px;height:auto}
.ring-bg{fill:none;stroke:var(--pine-soft);stroke-width:9}
.ring-fg{fill:none;stroke-width:9;stroke-linecap:round}
.ring-pct{font-family:var(--serif);font-size:19px;font-weight:700;fill:var(--ink)}
.ring figcaption{font-weight:600;font-size:15px}
.ring small{display:block;color:var(--muted);font-weight:400}
.attn{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.attn li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.attn .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--gold)}
.attn .dot.warn{background:var(--berry)}
.attn .dot.ok{background:var(--pine)}
.attn .txt{flex:1;min-width:0}

/* onboarding */
.onboard{max-width:640px;margin:20px auto;text-align:left}
.onboard ol{padding-left:22px;margin:16px 0 22px}
.onboard li{margin-bottom:8px}

/* toolbar + gift rows */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px}
.field,.toolbar input,.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:42px}
.summary{margin-bottom:10px;color:var(--muted);font-size:15px}
.gtable{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ghead,.grow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px 16px;align-items:center;padding:12px 16px}
.ghead{color:var(--muted);font-size:14px;background:var(--pine-soft);font-weight:600}
.grow{border-top:1px solid var(--line)}
.ghead + div .grow:first-child{border-top:0}
.g-main strong{display:block;overflow-wrap:anywhere}
.sub{display:block;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.g-money{font-variant-numeric:tabular-nums;font-size:15px}
.g-money .k{color:var(--muted);font-size:13px;margin-right:4px}
.badge{display:inline-block;font-size:13px;padding:1px 8px;border-radius:999px;background:var(--pine-soft);color:var(--pine);margin-left:4px}
.badge.over{background:var(--berry-soft);color:var(--berry)}
.g-checks{display:flex;gap:6px;flex-wrap:wrap}
.chip{position:relative;display:inline-block;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--surface)}
.chip input:checked + span{background:var(--pine);color:var(--on-pine);border-color:var(--pine)}
.chip input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

/* people + ideas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.pcard header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pcard ul{list-style:none;margin:0;padding:0;font-size:15px;display:grid;gap:4px}
.pcard li{display:flex;justify-content:space-between;gap:8px}
.pcard li span:last-child{color:var(--muted);white-space:nowrap}
.pcard .actions{margin-top:auto;padding-top:6px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.irow:first-child{border-top:0}
.stars{color:var(--gold);letter-spacing:2px;font-size:16px}
.ilist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}

/* shopping */
.store{margin-bottom:20px}
.store h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font-size:19px}
.store h2 span{font-family:var(--sans);font-weight:500;font-size:15px;color:var(--muted)}
.srow{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.srow input{width:22px;height:22px;margin-top:2px;accent-color:var(--pine);flex:none}
.srow label{flex:1;min-width:0;cursor:pointer}
.srow .price{font-variant-numeric:tabular-nums;white-space:nowrap}

/* forms and dialogs */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(580px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(8,18,14,.6)}
.form{padding:22px;display:grid;gap:14px}
.form h2{margin-bottom:2px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label,.lbl{display:grid;gap:4px;font-size:14px;font-weight:600}
.form input[type=text],.form input[type=number],.form input[type=url],.form input[type=date],.form select,.form textarea,.lbl input,.lbl select,.lbl textarea{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:400;width:100%;min-height:42px}
.form textarea,.lbl textarea{min-height:84px;resize:vertical}
.checks{display:flex;gap:18px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:8px;font-weight:500;font-size:16px}
.checks input{width:20px;height:20px;accent-color:var(--pine)}
.formbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.formbtns .left{margin-right:auto}
.hint{font-size:14px;color:var(--muted);font-weight:400}
.section{margin-bottom:26px}
.section > h2{margin-bottom:6px}
.section > p{margin-bottom:12px;max-width:64ch}
.srow2{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.santa-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.santa-out{margin-top:14px}
.reveal{min-width:11ch;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:50;max-width:calc(100% - 24px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
noscript p{padding:20px;text-align:center}
.foot{margin-top:36px;font-size:14px;color:var(--muted);max-width:70ch}

@media (max-width:860px){
  .grid2{grid-template-columns:1fr}
  .ghead{display:none}
  .grow{grid-template-columns:minmax(0,1fr) auto}
  .grow > .g-who,.grow > .g-money,.grow > .g-checks{grid-column:1 / -1}
  .grow > .g-who{margin-top:-6px}
  .santa-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .top{padding:10px 16px}
  .nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);gap:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
  .nav a{border-radius:0;text-align:center;padding:13px 2px;font-size:13px}
  .nav a[aria-current="page"]{background:var(--surface);box-shadow:inset 0 3px 0 var(--pine)}
  main{padding:20px 16px 96px}
  .hero{grid-template-columns:1fr;gap:6px;justify-items:center;text-align:center}
  .hero-main{width:100%;text-align:left}
  .money dd{font-size:26px}
  .toast{bottom:80px}
  .frow{grid-template-columns:1fr}
}
@media (max-width:420px){
  .money{grid-template-columns:1fr 1fr}
}
@media print{
  .top,.nav,.toolbar,.actions,.banner,.toast,.btn,.foot,.chip input{display:none !important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .panel,.gtable,.ilist{border-color:#999}
}
</style>
</head>
<body>
<noscript><p>Giftbook needs JavaScript turned on to run. It does not connect to the internet.</p></noscript>
<header class="top">
  <div class="brand"><b>Giftbook</b><span id="season"></span></div>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
</header>
<div id="banner" class="banner" hidden></div>
<main id="main"></main>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const KEY = 'giftbook.v1';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const sum = a => a.reduce((x, y) => x + y, 0);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const daysUntil = s => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return null;
  const t = new Date(); const a = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - a) / 864e5);
};
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return ''; return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}); };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const safeUrl = u => { u = String(u || '').trim(); if (!u) return ''; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u; try { const p = new URL(u); return /^https?:$/.test(p.protocol) ? p.href : ''; } catch (e) { return ''; } };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
function nextHoliday() { const n = new Date(); let y = n.getFullYear(); if (n > new Date(y, 11, 26)) y++; return `${y}-12-25`; }

/* ---------- state ---------- */
function defaultState() {
  const h = nextHoliday();
  return { v: 1, settings: { currency: '$', theme: 'auto', holiday: h, season: `Christmas ${h.slice(0, 4)}`, lastBackup: '' },
           recipients: [], gifts: [], ideas: [], santa: null, archive: [] };
}
function migrate(o) {
  const d = defaultState(); const s = Object.assign({}, d, o || {});
  s.settings = Object.assign({}, d.settings, (o && o.settings) || {});
  ['recipients', 'gifts', 'ideas', 'archive'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  return s;
}
let memoryOnly = false;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) { memoryOnly = true; }
  return defaultState();
}
let state = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { memoryOnly = true; updateBanner(); } }
function commit() { save(); render(); }

const rec = id => state.recipients.find(r => r.id === id);
const gift = id => state.gifts.find(g => g.id === id);
const idea = id => state.ideas.find(i => i.id === id);
const cost = g => (g.actual !== '' && g.actual != null && num(g.actual) > 0) ? num(g.actual) : num(g.budget);
const curRaw = n => (n < 0 ? '-' : '') + state.settings.currency + (Math.abs(n) < 0.005 ? 0 : Math.abs(n)).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const cur = n => esc(curRaw(n));

function totals(d) {
  const per = d.recipients.map(r => {
    const gs = d.gifts.filter(g => g.rid === r.id);
    const spent = sum(gs.filter(g => g.bought).map(cost));
    const toBuy = sum(gs.filter(g => !g.bought).map(g => num(g.budget)));
    const cap = num(r.budget);
    return { r, gs, spent, toBuy, cap, proj: spent + toBuy, left: cap - spent, over: cap > 0 && spent + toBuy > cap + 0.004 };
  });
  const cap = sum(per.map(p => p.cap)), spent = sum(per.map(p => p.spent)), toBuy = sum(per.map(p => p.toBuy));
  return { per, cap, spent, toBuy, proj: spent + toBuy, left: cap - spent, n: d.gifts.length,
           bought: d.gifts.filter(g => g.bought).length, wrapped: d.gifts.filter(g => g.wrapped).length, sent: d.gifts.filter(g => g.sent).length };
}

/* ---------- UI state, routing ---------- */
const VIEWS = [['overview', 'Overview'], ['gifts', 'Gifts'], ['people', 'People'], ['ideas', 'Ideas'], ['shopping', 'Shopping'], ['tools', 'Tools']];
const ui = { view: 'overview', q: '', rid: '', status: '', sort: 'person', ideaRid: '', revealed: new Set(), swung: false };
function routeFromHash() { const h = location.hash.slice(1); ui.view = VIEWS.some(v => v[0] === h) ? h : 'overview'; }

function applyChrome() {
  document.documentElement.dataset.theme = state.settings.theme || 'auto';
  $('#season').textContent = state.settings.season || 'Gift plan';
  document.title = `${VIEWS.find(v => v[0] === ui.view)[1]} | Giftbook`;
}
function updateBanner() {
  const b = $('#banner');
  if (memoryOnly) { b.hidden = false; b.textContent = 'This browser is not letting Giftbook save. Your list will be lost when you close the tab. Open Tools and download a backup before you leave.'; }
  else b.hidden = true;
}

/* ---------- small renderers ---------- */
function bar(spent, toBuy, cap) {
  const scale = Math.max(cap, spent + toBuy, 0.01);
  const over = cap > 0 && spent + toBuy > cap + 0.004, hard = cap > 0 && spent > cap + 0.004;
  return `<div class="bar ${over ? 'is-over' : ''}" role="img" aria-label="Spent ${esc(curRaw(spent))}, still to buy ${esc(curRaw(toBuy))}, budget ${esc(curRaw(cap))}">
    <i class="b-spent ${hard ? 'hard' : ''}" style="width:${spent / scale * 100}%"></i>
    <i class="b-plan" style="left:${spent / scale * 100}%;width:${toBuy / scale * 100}%"></i>
    ${cap > 0 ? `<b style="left:${cap / scale * 100}%"></b>` : ''}</div>`;
}
function ring(count, total, label, color) {
  const r = 34, c = 2 * Math.PI * r, pct = total ? count / total : 0;
  return `<figure class="ring"><svg viewBox="0 0 88 88" role="img" aria-label="${label}: ${count} of ${total}">
    <circle cx="44" cy="44" r="${r}" class="ring-bg"/>
    <circle cx="44" cy="44" r="${r}" class="ring-fg" style="stroke:${color};stroke-dasharray:${c};stroke-dashoffset:${c * (1 - pct)}" transform="rotate(-90 44 44)"/>
    <text x="44" y="50" text-anchor="middle" class="ring-pct">${Math.round(pct * 100)}%</text></svg>
    <figcaption>${label}<small>${count} of ${total}</small></figcaption></figure>`;
}
const stageText = g => g.sent ? 'Sent' : g.wrapped ? 'Wrapped' : g.bought ? 'Bought' : 'To buy';
const opts = (list, sel) => list.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(sel) ? ' selected' : ''}>${esc(l)}</option>`).join('');
const personOpts = (sel, any) => opts((any ? [['', any]] : []).concat(state.recipients.map(r => [r.id, r.name])), sel);

/* ---------- views ---------- */
function onboarding() {
  return `<section class="panel onboard"><h1>Plan every gift in one place</h1>
    <p class="muted" style="margin-top:8px">Giftbook keeps your list on this device. It needs no account and no internet.</p>
    <ol><li>Add the people you are buying for.</li><li>Give each person a budget.</li><li>Add gifts, then tick them off as you buy, wrap and send them.</li></ol>
    <div class="actions"><button class="btn" data-act="new-person">Add the first person</button><button class="btn quiet" data-act="sample">Load a sample list</button></div></section>`;
}

function viewOverview() {
  if (!state.recipients.length && !state.gifts.length) return onboarding();
  const t = totals(state), days = daysUntil(state.settings.holiday);
  let big, small;
  if (days === null) { big = '-'; small = 'Set a date in Tools'; }
  else if (days > 0) { big = days; small = days === 1 ? 'day to go' : 'days to go'; }
  else if (days === 0) { big = 'Today'; small = 'Happy holidays'; }
  else { big = 'Done'; small = 'Archive it in Tools'; }
  const swing = !ui.swung; ui.swung = true;
  let forecast;
  if (!t.cap) forecast = 'Give each person a budget to see how you are tracking.';
  else if (!t.n) forecast = 'No gifts planned yet.';
  else if (!t.toBuy) forecast = 'Everything on your list is bought.';
  else forecast = `Gifts you still plan to buy add ${cur(t.toBuy)}, which brings the total to ${cur(t.proj)}. ` +
    (t.proj > t.cap + 0.004 ? `That is ${cur(t.proj - t.cap)} over budget.` : `That leaves ${cur(t.cap - t.proj)} spare.`);

  const items = [];
  t.per.filter(p => p.over).forEach(p => items.push({ tone: 'warn', html: `<strong>${esc(p.r.name)}</strong> is on track to go ${cur(p.proj - p.cap)} over budget.`, go: 'people' }));
  state.gifts.filter(g => !g.bought && g.orderBy).forEach(g => {
    const d = daysUntil(g.orderBy); if (d === null || d > 7) return;
    const when = d < 0 ? `overdue by ${plural(-d, 'day')}` : d === 0 ? 'today' : `in ${plural(d, 'day')}`;
    items.push({ tone: d < 0 ? 'warn' : 'soon', html: `Order <strong>${esc(g.idea)}</strong> by ${esc(fmtDate(g.orderBy))} (${when}).`, id: g.id });
  });
  const unwrapped = state.gifts.filter(g => g.bought && !g.wrapped && !g.sent).length;
  if (unwrapped) items.push({ tone: 'soon', html: `${plural(unwrapped, 'bought gift')} still need wrapping.`, filter: 'unwrapped' });
  t.per.filter(p => !p.gs.length).slice(0, 2).forEach(p => items.push({ tone: 'soon', html: `<strong>${esc(p.r.name)}</strong> has no gifts planned yet.`, newGift: p.r.id }));
  const lb = state.settings.lastBackup ? daysUntil(state.settings.lastBackup.slice(0, 10)) : null;
  if (state.gifts.length && (lb === null || lb < -14)) items.push({ tone: 'soon', html: lb === null ? 'You have not downloaded a backup yet.' : `Your last backup was ${plural(-lb, 'day')} ago.`, go: 'tools', label: 'Back up' });
  items.sort((a, b) => (a.tone === 'warn' ? 0 : 1) - (b.tone === 'warn' ? 0 : 1));
  const attn = items.length ? `<ul class="attn">${items.slice(0, 6).map(i => `<li><span class="dot ${i.tone === 'warn' ? 'warn' : ''}"></span><span class="txt">${i.html}</span>${
      i.id ? `<button class="btn quiet small" data-act="edit-gift" data-id="${esc(i.id)}">Open</button>` :
      i.filter ? `<button class="btn quiet small" data-act="go-filter" data-id="${i.filter}">Show</button>` :
      i.newGift ? `<button class="btn quiet small" data-act="new-gift-for" data-id="${esc(i.newGift)}">Add gift</button>` :
      `<button class="btn quiet small" data-act="go" data-id="${i.go}">${i.label || 'Open'}</button>`}</li>`).join('')}</ul>`
    : `<ul class="attn"><li><span class="dot ok"></span><span class="txt">Nothing needs attention right now.</span></li></ul>`;

  const left = t.left;
  return `<section class="hero">
    <div class="tag-wrap"><svg class="twine" viewBox="0 0 90 70" aria-hidden="true"><path d="M14 66 C 14 30, 40 36, 52 20 S 80 4, 88 2" fill="none" stroke="var(--berry)" stroke-width="3.5" stroke-linecap="round"/></svg>
      <div class="tag ${swing ? 'swing' : ''}"><span class="tag-big ${typeof big === 'number' ? '' : 'word'}">${big}</span><span class="tag-small">${small}</span>${state.settings.holiday ? `<span class="tag-date">${esc(fmtDate(state.settings.holiday))}</span>` : ''}</div></div>
    <div class="hero-main"><h1>Where things stand</h1>
      <dl class="money"><div><dt>Budget</dt><dd>${cur(t.cap)}</dd></div><div><dt>Spent so far</dt><dd>${cur(t.spent)}</dd></div>
      <div><dt>${left < 0 ? 'Over budget by' : 'Left to spend'}</dt><dd class="${left < 0 ? 'neg' : ''}">${cur(Math.abs(left))}</dd></div></dl>
      <p class="forecast ${t.cap && t.proj > t.cap + 0.004 ? 'neg' : ''}">${forecast}</p></div></section>
    <div class="grid2">
      <section class="panel"><h2>Budget by person</h2>
        ${t.per.length ? t.per.map(p => `<div class="person-block"><div class="person-line"><strong>${esc(p.r.name)}</strong><span>${cur(p.spent)} of ${cur(p.cap)}</span></div>${bar(p.spent, p.toBuy, p.cap)}
          <p class="person-note ${p.over ? 'neg' : 'muted'}">${!p.cap ? 'No budget set.' : p.over ? `Heading ${cur(p.proj - p.cap)} over.` : p.toBuy ? `${cur(p.cap - p.proj)} spare after the gifts still to buy.` : `${cur(p.cap - p.spent)} left.`}</p></div>`).join('') : '<p class="muted">Add people to see their budgets here.</p>'}
        <p class="legend">Solid is spent. Striped is planned for gifts you have not bought. The vertical line is the budget.</p></section>
      <div class="stack">
        <section class="panel"><h2>Progress</h2><div class="rings">${ring(t.bought, t.n, 'Bought', 'var(--pine)')}${ring(t.wrapped, t.n, 'Wrapped', 'var(--gold)')}${ring(t.sent, t.n, 'Sent', 'var(--berry)')}</div></section>
        <section class="panel"><h2>Needs attention</h2>${attn}</section></div></div>`;
}

/* gifts */
function filteredGifts() {
  let list = state.gifts.map(g => ({ g, r: rec(g.rid) })).filter(x => x.r);
  const q = ui.q.trim().toLowerCase();
  if (q) list = list.filter(({ g, r }) => [g.idea, g.store, g.category, g.notes, r.name].join(' ').toLowerCase().includes(q));
  if (ui.rid) list = list.filter(x => x.g.rid === ui.rid);
  const f = {
    todo: g => !g.bought, unwrapped: g => g.bought && !g.wrapped && !g.sent, unsent: g => !g.sent, done: g => g.sent,
    over: g => num(g.budget) > 0 && num(g.actual) > num(g.budget) + 0.004
  }[ui.status];
  if (f) list = list.filter(x => f(x.g));
  const idx = id => state.recipients.findIndex(r => r.id === id);
  const sorts = {
    person: (a, b) => idx(a.g.rid) - idx(b.g.rid) || a.g.idea.localeCompare(b.g.idea),
    name: (a, b) => a.g.idea.localeCompare(b.g.idea),
    price: (a, b) => cost(b.g) - cost(a.g),
    due: (a, b) => (a.g.orderBy || '9999').localeCompare(b.g.orderBy || '9999'),
    status: (a, b) => (+a.g.bought + +a.g.wrapped + +a.g.sent) - (+b.g.bought + +b.g.wrapped + +b.g.sent)
  };
  return list.sort(sorts[ui.sort] || sorts.person);
}
function giftRow({ g, r }) {
  const planned = num(g.budget), actual = g.actual === '' || g.actual == null ? null : num(g.actual);
  let diff = '';
  if (planned > 0 && actual) { const d = planned - actual; diff = Math.abs(d) < 0.005 ? '' : d > 0 ? `<span class="badge">Saved ${cur(d)}</span>` : `<span class="badge over">Over by ${cur(-d)}</span>`; }
  const url = safeUrl(g.url);
  const chk = (f, l, title) => `<label class="chip" title="${title}"><input type="checkbox" data-act="toggle" data-f="${f}" data-id="${esc(g.id)}" ${g[f] ? 'checked' : ''} aria-label="${l}: ${esc(g.idea)}"><span>${l}</span></label>`;
  return `<article class="grow">
    <div class="g-main"><strong>${esc(g.idea)}</strong><span class="sub">${[g.category, g.store].filter(Boolean).map(esc).join(', ')}${url ? ` <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(host(url))}</a>` : ''}</span>${g.orderBy && !g.bought ? `<span class="sub">Order by ${esc(fmtDate(g.orderBy))}</span>` : ''}${g.notes ? `<span class="sub">${esc(g.notes)}</span>` : ''}</div>
    <div class="g-who">${esc(r.name)}</div>
    <div class="g-money">${planned ? `<div><span class="k">Planned</span>${cur(planned)}</div>` : ''}${actual != null ? `<div><span class="k">Actual</span>${cur(actual)}${diff}</div>` : ''}${!planned && actual == null ? '<span class="muted">No price yet</span>' : ''}</div>
    <div class="g-checks">${chk('bought', 'Bought', 'Bought it')}${chk('wrapped', 'Wrapped', 'Wrapped it')}${chk('sent', 'Sent', 'Sent it or gave it')}</div>
    <button class="btn quiet small" data-act="edit-gift" data-id="${esc(g.id)}" aria-label="Edit ${esc(g.idea)}">Edit</button></article>`;
}
function renderGiftRows() {
  const box = $('#giftRows'); if (!box) return;
  const list = filteredGifts();
  box.innerHTML = list.length ? list.map(giftRow).join('') :
    `<div class="empty">${state.gifts.length ? 'No gifts match these filters.' : 'No gifts yet.'}${state.gifts.length ? '' : '<br><button class="btn" data-act="new-gift">Add the first gift</button>'}</div>`;
  const spent = sum(list.filter(x => x.g.bought).map(x => cost(x.g)));
  $('#giftSummary').textContent = `${plural(list.length, 'gift')} shown. Spent on these so far: ${curRaw(spent)}.`;
}
function viewGifts() {
  return `<div class="page-head"><h1>Gifts</h1><div class="actions"><button class="btn" data-act="new-gift">Add gift</button><button class="btn quiet" data-act="print">Print</button></div></div>
  <div class="toolbar"><label class="sr" for="q">Search gifts</label><input id="q" type="search" data-live="q" placeholder="Search gifts, stores, people" value="${esc(ui.q)}">
    <label class="sr" for="frid">Person</label><select id="frid" data-act="filter" data-k="rid">${personOpts(ui.rid, 'Everyone')}</select>
    <label class="sr" for="fst">Status</label><select id="fst" data-act="filter" data-k="status">${opts([['', 'All gifts'], ['todo', 'Still to buy'], ['unwrapped', 'Bought, not wrapped'], ['unsent', 'Not sent yet'], ['done', 'Sent'], ['over', 'Over planned price']], ui.status)}</select>
    <label class="sr" for="fso">Sort</label><select id="fso" data-act="filter" data-k="sort">${opts([['person', 'Sort by person'], ['name', 'Sort by gift'], ['price', 'Sort by price'], ['due', 'Sort by order-by date'], ['status', 'Sort by progress']], ui.sort)}</select></div>
  <p id="giftSummary" class="summary" aria-live="polite"></p>
  <div class="gtable"><div class="ghead"><span>Gift</span><span>For</span><span>Price</span><span>Progress</span><span></span></div><div id="giftRows"></div></div>`;
}

/* people */
function viewPeople() {
  const t = totals(state);
  const head = `<div class="page-head"><h1>People</h1><div class="actions"><button class="btn" data-act="new-person">Add person</button></div></div>`;
  if (!t.per.length) return head + `<div class="panel empty">Add the people you are buying for, and set a budget for each.<br><button class="btn" data-act="new-person">Add a person</button></div>`;
  return head + `<div class="cards">${t.per.map(p => `<section class="pcard"><header><h3>${esc(p.r.name)}</h3><span class="muted">${esc(p.r.group || '')}</span></header>
    <div><div class="person-line"><span>${cur(p.spent)} spent</span><span>${p.cap ? `of ${cur(p.cap)}` : 'no budget set'}</span></div>${bar(p.spent, p.toBuy, p.cap)}</div>
    <p class="${p.over ? 'neg' : 'muted'}" style="font-size:15px">${p.over ? `Heading ${cur(p.proj - p.cap)} over budget.` : p.toBuy ? `${cur(p.toBuy)} planned for gifts still to buy.` : p.gs.length ? 'All gifts bought.' : 'No gifts yet.'}</p>
    ${p.gs.length ? `<ul>${p.gs.slice(0, 6).map(g => `<li><span>${esc(g.idea)}</span><span>${stageText(g)}</span></li>`).join('')}${p.gs.length > 6 ? `<li class="muted"><span>and ${p.gs.length - 6} more</span><span></span></li>` : ''}</ul>` : ''}
    ${p.r.notes ? `<p class="sub">${esc(p.r.notes)}</p>` : ''}
    <div class="actions"><button class="btn small" data-act="new-gift-for" data-id="${esc(p.r.id)}">Add gift</button><button class="btn quiet small" data-act="edit-person" data-id="${esc(p.r.id)}">Edit</button></div></section>`).join('')}</div>`;
}

/* ideas */
const stars = n => n ? `<span class="stars" role="img" aria-label="${n} of 5 stars">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>` : '';
function viewIdeas() {
  let list = state.ideas.slice();
  if (ui.ideaRid === '_any') list = list.filter(i => !i.rid); else if (ui.ideaRid) list = list.filter(i => i.rid === ui.ideaRid);
  list.sort((a, b) => (b.rating || 0) - (a.rating || 0));

  <p class="muted" style="margin-bottom:14px;max-width:64ch">Keep ideas here until you decide. Moving one to your gift list takes a click.</p>
  <div class="toolbar"><label class="sr" for="irid">Filter ideas by person</label><select id="irid" data-act="filter" data-k="ideaRid">${opts([['', 'All ideas'], ['_any', 'For anyone']].concat(state.recipients.map(r => [r.id, r.name])), ui.ideaRid)}</select></div>
  <div class="ilist">${list.length ? list.map(i => { const r = rec(i.rid), url = safeUrl(i.url); return `<div class="irow"><div><strong>${esc(i.idea)}</strong> ${stars(i.rating)}
    <span class="sub">${r ? `For ${esc(r.name)}` : 'For anyone'}${num(i.price) ? `, about ${cur(num(i.price))}` : ''}${url ? `, <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(host(url))}</a>` : ''}</span>${i.notes ? `<span class="sub">${esc(i.notes)}</span>` : ''}</div>
    <div class="actions"><button class="btn small" data-act="idea-to-gift" data-id="${esc(i.id)}">Move to gifts</button><button class="btn quiet small" data-act="edit-idea" data-id="${esc(i.id)}">Edit</button></div></div>`; }).join('') :
    `<div class="empty">${state.ideas.length ? 'No ideas for this person.' : 'No ideas saved yet.<br><button class="btn" data-act="new-idea">Save the first idea</button>'}</div>`}</div>`;
}

/* shopping */
function shopGroups() {
  const m = new Map();
  state.gifts.filter(g => !g.bought && rec(g.rid)).forEach(g => { const k = (g.store || '').trim() || 'Store not set'; if (!m.has(k)) m.set(k, []); m.get(k).push(g); });
  return [...m.entries()].sort((a, b) => (a[0] === 'Store not set') - (b[0] === 'Store not set') || a[0].localeCompare(b[0]))
    .map(([store, gs]) => [store, gs.sort((a, b) => (a.orderBy || '9999').localeCompare(b.orderBy || '9999') || a.idea.localeCompare(b.idea))]);
}
function viewShopping() {
  const groups = shopGroups(), all = groups.flatMap(g => g[1]);
  const head = `<div class="page-head"><h1>Shopping list</h1><div class="actions"><button class="btn quiet" data-act="print">Print</button><button class="btn quiet" data-act="copy-list">Copy as text</button></div></div>`;
  if (!all.length) return head + `<div class="panel empty">${state.gifts.length ? 'Nothing left to buy. Nice work.' : 'Gifts you have not bought yet will appear here, grouped by store.'}</div>`;
  return head + `<p class="summary">${plural(all.length, 'gift')} to buy, about ${cur(sum(all.map(g => num(g.budget))))}. Tick a gift to mark it as bought.</p>` +
    groups.map(([store, gs]) => `<section class="store"><h2>${esc(store)}<span>${plural(gs.length, 'gift')}, ${cur(sum(gs.map(g => num(g.budget))))}</span></h2>${gs.map(g => { const url = safeUrl(g.url), r = rec(g.rid);
      return `<div class="srow"><input type="checkbox" id="s${esc(g.id)}" data-act="got" data-id="${esc(g.id)}"><label for="s${esc(g.id)}"><strong>${esc(g.idea)}</strong><span class="sub">For ${esc(r.name)}${g.orderBy ? `, order by ${esc(fmtDate(g.orderBy))}` : ''}</span></label>
      ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="sub">${esc(host(url))}</a>` : ''}<span class="price">${num(g.budget) ? cur(num(g.budget)) : ''}</span></div>`; }).join('')}</section>`).join('');
}

/* tools */

    <form data-form="santa"><div class="santa-grid"><label class="lbl">Names, one per line<textarea name="names" rows="5" placeholder="Ana&#10;Ben&#10;Cara&#10;Dev">${esc(sa ? sa.names.join('\n') : '')}</textarea></label>

  <section class="panel section"><h2>Backup and export</h2><p class="muted">Your list lives in this browser only. Download a backup now and then, and use it to move to another device.</p>

  <section class="panel section"><h2>Settings</h2><div class="settings">
    <label class="lbl">Season name<input type="text" data-act="set" data-k="season" value="${esc(s.season)}" maxlength="40"></label>
    <label class="lbl">Gift day<input type="date" data-act="set" data-k="holiday" value="${esc(s.holiday)}"></label>
    <label class="lbl">Currency symbol<input type="text" data-act="set" data-k="currency" value="${esc(s.currency)}" maxlength="5"></label>
    <label class="lbl">Theme<select data-act="set" data-k="theme">${opts([['auto', 'Match my device'], ['light', 'Light'], ['dark', 'Dark']], s.theme)}</select></label></div></section>
  <section class="panel section"><h2>Start over</h2><div class="actions"><button class="btn quiet" data-act="sample">Load sample list</button><button class="btn danger" data-act="clear">Delete everything</button></div>
    <p class="hint" style="margin-top:8px">Both can be undone right after you tap them.</p></section>
  <p class="foot">Giftbook runs entirely in this file. It sends nothing anywhere and keeps working with no connection.</p>`;
}

/* ---------- render ---------- */
const VIEW_FN = { overview: viewOverview, gifts: viewGifts, people: viewPeople, ideas: viewIdeas, shopping: viewShopping, tools: viewTools };
function render() {
  applyChrome(); updateBanner();
  $('#nav').innerHTML = VIEWS.map(([k, l]) => `<a href="#${k}" ${ui.view === k ? 'aria-current="page"' : ''}>${l}</a>`).join('');

/* ---------- dialogs and toast ---------- */
const dlg = $('#dlg'); let dlgHandler = null;
function openDialog(html, onSubmit) {
  dlg.innerHTML = html; dlgHandler = onSubmit || null;
  if (!dlg.open) dlg.showModal();
  const f = dlg.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea'); if (f) f.focus();
}
const closeDialog = () => { if (dlg.open) dlg.close(); };
dlg.addEventListener('submit', e => { e.preventDefault(); if (dlgHandler && dlgHandler(new FormData(e.target)) !== false) closeDialog(); });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDialog(); });
let toastTimer;
function toast(msg, undoFn) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${undoFn ? '<button type="button" data-act="toast-undo">Undo</button>' : ''}`;
  t._undo = undoFn || null; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, undoFn ? 9000 : 3500);
}
function toastUndo(msg, snap) { toast(msg, () => { state = migrate(JSON.parse(snap)); commit(); toast('Restored.'); }); }

/* ---------- forms ---------- */
const CATS = ['Electronics', 'Books', 'Toys', 'Clothing', 'Home', 'Food', 'Beauty', 'Hobbies', 'Sports', 'Experience', 'Other'];
function openGift(id, prefill, fromIdea) {
  if (!state.recipients.length) { toast('Add a person first, then add their gifts.'); location.hash = 'people'; return; }
  const g = id ? gift(id) : Object.assign({ rid: state.recipients[0].id, idea: '', category: '', store: '', url: '', budget: '', actual: '', bought: false, wrapped: false, sent: false, delivery: 'In person', address: '', notes: '', orderBy: '' }, prefill || {});
  openDialog(`<form class="form"><h2 id="dlgTitle">${id ? 'Edit gift' : 'Add gift'}</h2>
    <label>Gift<input type="text" name="idea" required value="${esc(g.idea)}" maxlength="120"></label>
    <div class="frow"><label>For<select name="rid">${personOpts(g.rid)}</select></label>
      <label>Category<input type="text" name="category" list="cats" value="${esc(g.category)}" maxlength="40"></label></div>
    <datalist id="cats">${CATS.map(c => `<option value="${c}">`).join('')}</datalist>
    <div class="frow"><label>Store<input type="text" name="store" value="${esc(g.store)}" maxlength="60"></label>
      <label>Link<input type="url" name="url" placeholder="https://" value="${esc(g.url)}"></label></div>
    <div class="frow"><label>Planned price<input type="number" name="budget" min="0" step="0.01" inputmode="decimal" value="${g.budget === '' ? '' : esc(g.budget)}"></label>
      <label>Actual price<input type="number" name="actual" min="0" step="0.01" inputmode="decimal" value="${g.actual === '' ? '' : esc(g.actual)}"></label></div>
    <div class="frow"><label>Order by<input type="date" name="orderBy" value="${esc(g.orderBy)}"></label>
      <label>Delivery<select name="delivery">${opts(['In person', 'Post or courier', 'Sent direct from the shop'].map(x => [x, x]), g.delivery)}</select></label></div>
    <label>Address or drop-off details<textarea name="address" rows="2">${esc(g.address)}</textarea></label>
    <label>Notes<textarea name="notes" rows="2">${esc(g.notes)}</textarea></label>
    <div class="checks"><label><input type="checkbox" name="bought" ${g.bought ? 'checked' : ''}>Bought</label><label><input type="checkbox" name="wrapped" ${g.wrapped ? 'checked' : ''}>Wrapped</label><label><input type="checkbox" name="sent" ${g.sent ? 'checked' : ''}>Sent</label></div>
    <div class="formbtns">${id ? `<button type="button" class="btn danger left" data-act="del-gift" data-id="${esc(id)}">Delete</button>` : ''}<button type="button" class="btn quiet" data-act="close">Cancel</button><button class="btn" type="submit">Save gift</button></div></form>`,
  fd => {
    const d = { rid: fd.get('rid'), idea: fd.get('idea').trim(), category: fd.get('category').trim(), store: fd.get('store').trim(), url: fd.get('url').trim(),
      budget: fd.get('budget') === '' ? '' : num(fd.get('budget')), actual: fd.get('actual') === '' ? '' : num(fd.get('actual')),
      orderBy: fd.get('orderBy') || '', delivery: fd.get('delivery'), address: fd.get('address').trim(), notes: fd.get('notes').trim(),
      bought: fd.get('bought') === 'on', wrapped: fd.get('wrapped') === 'on', sent: fd.get('sent') === 'on' };
    if (!d.idea) return false;
    if (d.wrapped || d.sent) d.bought = true;
    if (id) Object.assign(g, d); else state.gifts.push(Object.assign({ id: uid() }, d));
    if (fromIdea) { state.ideas = state.ideas.filter(i => i.id !== fromIdea); toast('Moved to your gift list.'); }
    commit();
  });
}
function openPerson(id) {
  const r = id ? rec(id) : { name: '', group: 'Family', budget: '', notes: '' };
  openDialog(`<form class="form"><h2 id="dlgTitle">${id ? 'Edit person' : 'Add person'}</h2>
    <label>Name<input type="text" name="name" required value="${esc(r.name)}" maxlength="60"></label>
    <div class="frow"><label>Group<input type="text" name="group" list="groups" value="${esc(r.group)}" maxlength="30"></label>
      <label>Budget<input type="number" name="budget" min="0" step="0.01" inputmode="decimal" value="${r.budget === '' ? '' : esc(r.budget)}"></label></div>
    <datalist id="groups"><option value="Family"><option value="Friends"><option value="Work"><option value="Neighbours"><option value="Teachers"></datalist>
    <label>Notes<span class="hint">Sizes, favourites, things they already have.</span><textarea name="notes" rows="3">${esc(r.notes)}</textarea></label>
    <div class="formbtns">${id ? `<button type="button" class="btn danger left" data-act="del-person" data-id="${esc(id)}">Delete</button>` : ''}<button type="button" class="btn quiet" data-act="close">Cancel</button><button class="btn" type="submit">Save person</button></div></form>`,
  fd => {
    const d = { name: fd.get('name').trim(), group: fd.get('group').trim(), budget: fd.get('budget') === '' ? '' : num(fd.get('budget')), notes: fd.get('notes').trim() };
    if (!d.name) return false;
    if (id) Object.assign(r, d); else state.recipients.push(Object.assign({ id: uid() }, d));
    commit();
  });
}
function openIdea(id) {
  const i = id ? idea(id) : { rid: ui.ideaRid && ui.ideaRid !== '_any' ? ui.ideaRid : '', idea: '', url: '', price: '', rating: 0, notes: '' };
  openDialog(`<form class="form"><h2 id="dlgTitle">${id ? 'Edit idea' : 'Save an idea'}</h2>
    <label>Idea<input type="text" name="idea" required value="${esc(i.idea)}" maxlength="120"></label>
    <div class="frow"><label>For<select name="rid">${personOpts(i.rid, 'Anyone')}</select></label>
      <label>Rough price<input type="number" name="price" min="0" step="0.01" inputmode="decimal" value="${i.price === '' ? '' : esc(i.price)}"></label></div>
    <div class="frow"><label>Link<input type="url" name="url" placeholder="https://" value="${esc(i.url)}"></label>
      <label>How much you like it<select name="rating">${opts([[0, 'No rating'], [1, '1 star'], [2, '2 stars'], [3, '3 stars'], [4, '4 stars'], [5, '5 stars']], i.rating || 0)}</select></label></div>
    <label>Notes<textarea name="notes" rows="2">${esc(i.notes)}</textarea></label>
    <div class="formbtns">${id ? `<button type="button" class="btn danger left" data-act="del-idea" data-id="${esc(id)}">Delete</button>` : ''}<button type="button" class="btn quiet" data-act="close">Cancel</button><button class="btn" type="submit">Save idea</button></div></form>`,
  fd => {
    const d = { rid: fd.get('rid'), idea: fd.get('idea').trim(), url: fd.get('url').trim(), price: fd.get('price') === '' ? '' : num(fd.get('price')), rating: +fd.get('rating') || 0, notes: fd.get('notes').trim() };
    if (!d.idea) return false;
    if (id) Object.assign(i, d); else state.ideas.push(Object.assign({ id: uid() }, d));
    commit();
  });
}

/* ---------- sample, csv, download ---------- */
function loadSample() {
  const s = defaultState(); const id = {};
  const people = [['Emma (Daughter)', 'Family', 250], ['Liam (Son)', 'Family', 250], ['Sarah (Spouse)', 'Family', 400], ['Mom & Dad', 'Family', 200], ['Alex (Colleague)', 'Work', 50], ['Secret Santa group', 'Friends', 40]];
  people.forEach(([name, group, budget]) => { const r = { id: uid(), name, group, budget, notes: '' }; id[name] = r.id; s.recipients.push(r); });
  const due = (() => { const [y, m, d] = s.settings.holiday.split('-').map(Number); return iso(new Date(y, m - 1, d - 14)); })();
  // [person, gift, store, planned, actual, stage (0 to buy, 1 bought, 2 wrapped, 3 sent), category]
  [['Emma (Daughter)', 'Wireless headphones', 'Amazon', 120, 115.5, 2, 'Electronics'], ['Emma (Daughter)', 'Art supply kit', 'Michaels', 50, 45, 3, 'Hobbies'], ['Emma (Daughter)', 'Graphic novel box set', 'Barnes & Noble', 75, '', 0, 'Books'],
   ['Liam (Son)', 'Lego Star Wars set', 'Target', 140, 130, 2, 'Toys'], ['Liam (Son)', 'Soccer cleats', "Dick's Sporting Goods", 90, 95, 3, 'Sports'],
   ['Sarah (Spouse)', 'Cashmere scarf', 'Nordstrom', 150, 140, 2, 'Clothing'], ['Sarah (Spouse)', 'Kindle Paperwhite', 'Amazon', 140, 129.99, 3, 'Electronics'], ['Sarah (Spouse)', 'Luxury candle set', 'Etsy', 60, '', 0, 'Home'],
   ['Mom & Dad', 'Digital photo frame', 'Best Buy', 130, 119.99, 3, 'Electronics'], ['Mom & Dad', 'Gourmet coffee basket', 'Local Roasters', 60, '', 0, 'Food'],
   ['Alex (Colleague)', 'Desk plant and mug', 'Target', 45, 42, 2, 'Office'], ['Secret Santa group', 'Thermal travel tumbler', 'Amazon', 35, 32.5, 3, 'Home']]
  .forEach(([p, idea, store, budget, actual, st, category]) => s.gifts.push({ id: uid(), rid: id[p], idea, category, store, url: '', budget, actual, bought: st > 0, wrapped: st > 1, sent: st > 2, delivery: 'In person', address: '', notes: '', orderBy: st === 0 ? due : '' }));
  s.ideas.push({ id: uid(), rid: id['Liam (Son)'], idea: 'Pocket telescope', url: '', price: 30, rating: 4, notes: 'He asked about stars.' });
  return s;
}
const csvCell = v => { if (typeof v === 'number') return String(v); let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function listAsText() {
  return shopGroups().map(([store, gs]) => `${store}\n` + gs.map(g => `  [ ] ${g.idea} (for ${rec(g.rid).name})${num(g.budget) ? ' ' + curRaw(num(g.budget)) : ''}`).join('\n')).join('\n\n');
}

/* ---------- actions ---------- */
const A = {
  close: () => closeDialog(),
  go: id => { location.hash = id; },
  print: () => window.print(),
  'toast-undo': () => { const t = $('#toast'); const f = t._undo; t.hidden = true; if (f) f(); },
  'new-gift': () => openGift(),
  'new-gift-for': id => { closeDialog(); openGift(null, { rid: id }); },
  'edit-gift': id => openGift(id),
  'del-gift': id => { const g = gift(id), snap = JSON.stringify(state); state.gifts = state.gifts.filter(x => x.id !== id); commit(); closeDialog(); toastUndo(`Removed ${g.idea}.`, snap); },
  'new-person': () => openPerson(),
  'edit-person': id => openPerson(id),
  'del-person': id => {
    const r = rec(id), n = state.gifts.filter(g => g.rid === id).length, snap = JSON.stringify(state);
    state.recipients = state.recipients.filter(x => x.id !== id); state.gifts = state.gifts.filter(g => g.rid !== id); state.ideas.forEach(i => { if (i.rid === id) i.rid = ''; });
    commit(); closeDialog(); toastUndo(`Removed ${r.name}${n ? ` and ${plural(n, 'gift')}` : ''}.`, snap);
  },
  'new-idea': () => openIdea(),
  'edit-idea': id => openIdea(id),
  'del-idea': id => { const i = idea(id), snap = JSON.stringify(state); state.ideas = state.ideas.filter(x => x.id !== id); commit(); closeDialog(); toastUndo(`Removed ${i.idea}.`, snap); },
  'idea-to-gift': id => { const i = idea(id); if (!i) return; openGift(null, { rid: i.rid || (state.recipients[0] || {}).id, idea: i.idea, url: i.url, budget: i.price, notes: i.notes }, id); },
  toggle: (id, el) => {
    const g = gift(id), f = el.dataset.f; if (!g) return;
    g[f] = el.checked;
    if (f === 'bought' && !g.bought) { g.wrapped = false; g.sent = false; }
    if ((f === 'wrapped' || f === 'sent') && el.checked) g.bought = true;
    save(); renderGiftRows();
    const again = $(`[data-act="toggle"][data-id="${CSS.escape(id)}"][data-f="${f}"]`); if (again) again.focus();
  },
  got: id => { const g = gift(id); if (!g) return; g.bought = true; commit(); toast(`Marked ${g.idea} as bought.`, () => { g.bought = false; commit(); }); },
  filter: (id, el) => {
    ui[el.dataset.k] = el.value;
    if (ui.view === 'gifts') renderGiftRows(); else { render(); const again = $(`[data-k="${el.dataset.k}"]`); if (again) again.focus(); }
  },
  'go-filter': id => { ui.status = id; ui.rid = ''; ui.q = ''; location.hash = 'gifts'; if (ui.view === 'gifts') render(); },
  set: (id, el) => { state.settings[el.dataset.k] = el.value; save(); applyChrome(); },
  sample: () => { const snap = JSON.stringify(state); state = loadSample(); ui.q = ui.rid = ui.status = ''; commit(); toastUndo('Sample list loaded.', snap); },
  clear: () => { const snap = JSON.stringify(state), keep = state.settings; state = defaultState(); state.settings = Object.assign(state.settings, { currency: keep.currency, theme: keep.theme }); commit(); toastUndo('Everything deleted.', snap); },
  backup: () => { download(`giftbook-backup-${iso(new Date())}.json`, JSON.stringify(state, null, 2), 'application/json'); state.settings.lastBackup = new Date().toISOString(); save(); render(); toast('Backup downloaded.'); },
  restore: (id, el) => {
    const f = el.files && el.files[0]; if (!f) return;
    f.text().then(txt => {
      try { const o = JSON.parse(txt); if (!o || !Array.isArray(o.recipients) || !Array.isArray(o.gifts)) throw new Error('bad'); const snap = JSON.stringify(state); state = migrate(o); commit(); toastUndo('Backup restored.', snap); }
      catch (e) { toast('That file is not a Giftbook backup.'); }
    });
    el.value = '';
  },
  csv: () => {
    const head = ['Person', 'Gift', 'Category', 'Store', 'Link', 'Planned', 'Actual', 'Bought', 'Wrapped', 'Sent', 'Delivery', 'Address', 'Order by', 'Notes'];
    const rows = state.gifts.filter(g => rec(g.rid)).map(g => [rec(g.rid).name, g.idea, g.category, g.store, g.url, g.budget === '' ? '' : num(g.budget), g.actual === '' ? '' : num(g.actual), g.bought ? 'Yes' : 'No', g.wrapped ? 'Yes' : 'No', g.sent ? 'Yes' : 'No', g.delivery, g.address, g.orderBy, g.notes]);
    download(`giftbook-gifts-${iso(new Date())}.csv`, '﻿' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    toast('CSV downloaded.');
  },
  'copy-list': () => {
    const t = listAsText();
    const done = () => toast('Shopping list copied.');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => toast('Copy was blocked by the browser.'));
    else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy was blocked by the browser.'); } ta.remove(); }
  },
  'santa-toggle': (id, el) => {
    if (ui.revealed.has(id)) ui.revealed.delete(id); else ui.revealed.add(id);
    const row = el.closest('[data-santa]'); row.outerHTML = santaRow(id);
    const again = $(`[data-act="santa-toggle"][data-id="${CSS.escape(id)}"]`); if (again) again.focus();
  },
  'santa-clear': () => { state.santa = null; ui.revealed.clear(); commit(); },
  archive: () => {
    const next = String((+state.settings.holiday.slice(0, 4) || new Date().getFullYear()) + 1);
    openDialog(`<form class="form"><h2 id="dlgTitle">Archive ${esc(state.settings.season)}</h2>
      <p class="muted">Your gifts and budgets are saved to the archive, so you can look back at them later.</p>
      <div class="frow"><label>Next season name<input type="text" name="season" value="Christmas ${next}" maxlength="40"></label><label>Gift day<input type="date" name="holiday" value="${next}-12-25"></label></div>
      <div class="checks"><label><input type="checkbox" name="people" checked>Keep my people and budgets</label><label><input type="checkbox" name="ideas" checked>Keep my saved ideas</label></div>
      <div class="formbtns"><button type="button" class="btn quiet" data-act="close">Cancel</button><button class="btn" type="submit">Archive and start fresh</button></div></form>`,
    fd => {
      const snap = JSON.stringify(state), keepP = fd.get('people') === 'on', keepI = fd.get('ideas') === 'on';
      state.archive.unshift({ id: uid(), label: state.settings.season, savedAt: new Date().toISOString(), holiday: state.settings.holiday, recipients: JSON.parse(JSON.stringify(state.recipients)), gifts: JSON.parse(JSON.stringify(state.gifts)), ideas: JSON.parse(JSON.stringify(state.ideas)) });
      state.gifts = []; state.santa = null; ui.revealed.clear();
      if (!keepP) { state.recipients = []; state.ideas.forEach(i => { i.rid = ''; }); }
      if (!keepI) state.ideas = [];
      state.settings.season = fd.get('season').trim() || `Christmas ${next}`; state.settings.holiday = fd.get('holiday') || `${next}-12-25`;
      commit(); toastUndo('Season archived. Your new list is ready.', snap);
    });
  },
  'view-archive': id => {
    const a = state.archive.find(x => x.id === id); if (!a) return; const t = totals(a);
    openDialog(`<div class="form"><h2 id="dlgTitle">${esc(a.label)}</h2><p class="muted">Saved ${esc(fmtDate((a.savedAt || '').slice(0, 10)))}. Budget ${cur(t.cap)}, spent ${cur(t.spent)}, ${plural(t.n, 'gift')}.</p>
      ${t.per.map(p => `<div class="person-block"><div class="person-line"><strong>${esc(p.r.name)}</strong><span>${cur(p.spent)} of ${cur(p.cap)}</span></div>${p.gs.length ? `<ul style="margin:6px 0 0;padding-left:18px">${p.gs.map(g => `<li>${esc(g.idea)} <span class="muted">${cur(cost(g))}</span></li>`).join('')}</ul>` : '<p class="muted">No gifts.</p>'}</div>`).join('')}
      <div class="formbtns"><button type="button" class="btn danger left" data-act="del-archive" data-id="${esc(id)}">Delete archive</button><button type="button" class="btn" data-act="close">Close</button></div></div>`);
  },
  'del-archive': id => { const snap = JSON.stringify(state); state.archive = state.archive.filter(x => x.id !== id); commit(); closeDialog(); toastUndo('Archive deleted.', snap); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.matches('input,select,textarea,label')) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset.id, el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('input[data-act],select[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset.id, el, e);
});
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.live === 'q') { ui.q = e.target.value; renderGiftRows(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form="santa"]'); if (!f) return; e.preventDefault();
  const fd = new FormData(f);
  const names = [...new Set(String(fd.get('names')).split('\n').map(s => s.trim()).filter(Boolean))];
  if (names.length < 3) { toast('Add at least three names to draw.'); return; }
  const lower = new Map(names.map(n => [n.toLowerCase(), n])), avoidLines = String(fd.get('avoid')).split('\n').map(s => s.trim()).filter(Boolean), bad = new Set(), unknown = [];
  avoidLines.forEach(line => {
    const parts = line.split(/\s+-\s+|\s*,\s*/).map(s => s.trim().toLowerCase()).filter(Boolean);
    if (parts.length !== 2 || !lower.has(parts[0]) || !lower.has(parts[1])) { unknown.push(line); return; }
    const a = lower.get(parts[0]), b = lower.get(parts[1]); bad.add(a + '\u0000' + b); bad.add(b + '\u0000' + a);
  });
  if (unknown.length) { toast(`Check this pair: "${unknown[0]}". Use two names from the list with a spaced dash.`); return; }
  for (let t = 0; t < 5000; t++) {
    const r = shuffle(names.slice());
    if (names.every((n, i) => n !== r[i] && !bad.has(n + '\u0000' + r[i]))) {
      state.santa = { names, avoid: avoidLines, pairs: Object.fromEntries(names.map((n, i) => [n, r[i]])), at: new Date().toISOString() };
      ui.revealed.clear(); commit(); toast('Names drawn. Tap a name to see who they buy for.'); return;
    }
  }
  toast('No draw works with those pairs. Remove one and try again.');
});
window.addEventListener('hashchange', () => { routeFromHash(); render(); window.scrollTo(0, 0); });

routeFromHash(); render();
})();
</script>
